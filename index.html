  <script src="js/boot.js"></script>

<body class="home">
  <header class="home-top" data-reveal="load">
    <a class="wordmark" href="index.html">스터디 복습 퀴즈</a>
    <a id="past-weeks" class="text-link" href="index.html" hidden>지난 주차</a>
  </header>
  <main>
    <section class="hero">
      <h1 data-reveal="load">이번 주 시험지</h1>
      <p id="hero-sub" class="hero-sub" data-reveal="load"></p>
    </section>
    <div id="stack" class="stack">
      <div class="band" data-reveal="load"></div>
      <div class="band" data-reveal="load"></div>
      <section id="app" class="folder" data-reveal="load">
        <h2 class="folder-tab">시험지</h2>
        <div id="preview" class="preview" aria-live="polite" data-state="idle">
          <p class="preview-idle">폴더 탭을 가리키거나 눌러 보세요. 그 사람의 이번 주 기록과 문제 수가 나와요.</p>
        </div>
        <fieldset class="member-pick" data-reveal>
          <legend>이름을 골라 주세요</legend>
          <div id="members" class="member-grid"></div>
        </fieldset>
        <div class="folder-action" data-reveal>
          <button id="start" class="button" type="button">풀기 시작</button>
          <p id="start-hint" class="start-hint" role="status"></p>
        </div>
        <noscript><p class="folder-note">이 사이트는 자바스크립트가 켜져 있어야 쓸 수 있어요.</p></noscript>
      </section>
    </div>
    <section id="sources" class="sources" aria-labelledby="sources-title">
      <div class="sources-col">
        <h2 id="sources-title" class="giant" data-reveal>출처</h2>
        <div id="bars" class="bars"></div>
      </div>
    </section>

    <section id="how" class="how" aria-labelledby="how-title">
      <div class="how-text">
        <h2 id="how-title" data-reveal>한 주는 이렇게</h2>
        <p class="how-lead" data-reveal>월요일부터 목요일까지 각자 남긴 기록이 금요일에 열 문제가 되고, 제출하면 바로 채점돼요.</p>
      </div>
      <div id="slip" class="slip" data-reveal="slip"></div>
    </section>

    <section id="contents" class="contents" aria-labelledby="contents-title">
      <div class="contents-head">
        <h2 id="contents-title" data-reveal>이번 주 차례</h2>
        <p class="contents-note" data-reveal>책등을 누르면 그 문제가 시험지에서 바로 열려요.</p>
      </div>
      <div class="shelf-wrap">
        <ol id="shelf" class="shelf"></ol>
      </div>
    </section>
  </main>

  <footer id="back" class="back">
    <div class="card">
      <div class="card-edge" aria-hidden="true"></div>
      <div class="card-body">
      <div class="card-left">
        <h2 class="signoff" data-reveal>금요일에 만나요</h2>
        <p id="card-message" class="card-message" data-reveal>이번 주 시험지를 풀고 나면 점수와 해설, 틀린 문제가 손에 남아요.</p>
      </div>
      <p class="imprint" data-reveal>© 2026 스터디 복습 퀴즈 · KT 에이블스쿨 복습 스터디</p>
      </div>
    </div>
  </footer>
