<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이번 주 시험지 · 스터디 복습 퀴즈</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <script src="js/boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/sheet.css">
  <script type="module" src="js/quiz.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="index.html">스터디 복습 퀴즈</a>
  </header>
  <main id="app" class="sheet-page">
    <p class="loading" role="status">시험지를 불러오는 중이에요.</p>
    <noscript><p class="loading">이 시험지는 자바스크립트가 켜져 있어야 풀 수 있어요.</p></noscript>
  </main>
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
    <form method="dialog">
      <h2 id="confirm-title">제출할까요?</h2>
      <p id="confirm-desc"><span id="blank-lead"></span><span id="blank-count" hidden></span><span id="blank-tail"></span></p>
      <div class="confirm-actions">
        <button class="button button--quiet" type="submit" value="cancel" autofocus>돌아가서 마저 풀기</button>
        <button class="button" type="submit" value="submit">제출하기</button>
      </div>
    </form>
  </dialog>
</body>
</html>
